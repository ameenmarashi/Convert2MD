name: md_converter
description: Convert documents to Markdown on iOS, iPadOS, macOS and Android — entirely on device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (single solution across the app).
  flutter_riverpod: ^2.5.1

  # Document parsing.
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.4
  crypto: ^3.0.3

  # Platform integration.
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Markdown preview.
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
