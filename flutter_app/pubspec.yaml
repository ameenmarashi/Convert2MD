name: md_converter
description: Convert documents to Markdown on iOS, iPadOS, macOS and Android — entirely on device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (single solution across the app).
  flutter_riverpod: ^2.5.1

  # Document parsing.
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.4
  crypto: ^3.0.3

  # Platform integration.
  shared_preferences: ^2.3.2
  file_picker: ^12.0.0
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  share_plus: ^13.3.0

  # Markdown preview.
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generate the launcher icon and the launch screen for both platforms from
  # one source image, so iOS and Android are identical by construction.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  # IBM Plex Mono, bundled so the native apps match the PWA and the rest of the
  # Rx Suite family without a network fetch. Arabic falls back to the platform
  # font, which IBM Plex Mono does not cover.
  fonts:
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

# Both blocks below take their colours from ../brand.json. Regenerate the source
# images with `npm --prefix ../web run icons`, then:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: assets/branding/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/icon-1024.png
  adaptive_icon_background: assets/branding/icon-background-1024.png
  adaptive_icon_foreground: assets/branding/icon-foreground-1024.png

flutter_native_splash:
  color: "#e9f4f3"
  color_dark: "#0e1b28"
  image: assets/branding/splash-logo.png
  image_dark: assets/branding/splash-logo.png
  android: true
  ios: true
  android_12:
    image: assets/branding/splash-logo.png
    color: "#e9f4f3"
    color_dark: "#0e1b28"
  fullscreen: false
