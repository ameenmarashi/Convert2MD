name: Publish PWA to GitHub Pages

# The site is served from the `gh-pages` branch: pushing that branch is what
# switched Pages on in the first place, without needing a repository setting
# changed by hand (the Actions token is refused on the "create Pages site" API).
#
# This job rebuilds web/public from source, runs the tests, and syncs the result
# onto gh-pages. GitHub's own "pages build and deployment" run then publishes it
# to https://ameenmarashi.github.io/Convert2MD/.

on:
  push:
    branches:
      - claude/md-converter-pwa-flutter-mpe3zh
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Compile TypeScript and regenerate the service worker
        run: npm run build
        working-directory: web

      - name: Run the converter tests
        run: npm test
        working-directory: web

      - name: Sync web/public onto the gh-pages branch
        run: |
          set -euo pipefail
          touch web/public/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages
          rsync -a --delete --exclude .git web/public/ /tmp/gh-pages/
          cd /tmp/gh-pages
          git add -A
          # Nothing to publish when the built output is unchanged.
          if git diff --cached --quiet; then
            echo "gh-pages already matches this build."
          else
            git commit -m "Publish MD Converter PWA from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi

      - name: Diagnose what the live URL is actually serving
        # Temporary: the site has been reported as showing stale CSS despite a
        # successful deploy. This runs from GitHub's own network (unlike a
        # phone or a sandboxed dev environment) to get an unambiguous answer
        # about whether it's edge-cache staleness or something upstream of
        # this workflow entirely.
        run: |
          set -x
          for i in 1 2 3 4 5 6; do
            sleep 20
            echo "=== attempt $i ==="
            curl -sS -D - "https://ameenmarashi.github.io/Convert2MD/styles.css?diag=${GITHUB_RUN_ID}-$i" -o /tmp/live.css || true
            grep -A2 '^\.button {' /tmp/live.css || echo "(.button rule not found)"
          done
