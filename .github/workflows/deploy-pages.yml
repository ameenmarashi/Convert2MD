name: Deploy PWA to GitHub Pages

# Publishes web/public to https://ameenmarashi.github.io/Convert2MD/.
# `configure-pages` with enablement turns Pages on the first time this runs, so
# no manual repository setting is needed.

on:
  push:
    branches:
      - claude/md-converter-pwa-flutter-mpe3zh
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Compile TypeScript and regenerate the service worker
        run: npm run build
        working-directory: web

      - name: Run the converter tests
        run: npm test
        working-directory: web

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
